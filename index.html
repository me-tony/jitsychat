<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JitsyChat</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://meet.jit.si/libs/lib-jitsi-meet.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>JitsyChat</h1>
        <p class="status" id="status">Disconnected</p>
      </header>
      <section class="join-panel" id="join-panel">
        <form id="join-form">
          <div class="field">
            <label for="room">Room Name</label>
            <input type="text" id="room" name="room" placeholder="team-sync" required />
          </div>
          <div class="field">
            <label for="displayName">Display Name</label>
            <input type="text" id="displayName" name="displayName" placeholder="Your name" required />
          </div>
          <div class="field">
            <label for="authId">Jitsi username</label>
            <input type="text" id="authId" name="authId" placeholder="you@example.com" autocomplete="username" />
          </div>
          <div class="field">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" name="authPassword" placeholder="Password" autocomplete="current-password" />
          </div>
          <div class="field">
            <label for="jwt">JWT (optional alternative)</label>
            <input type="text" id="jwt" name="jwt" placeholder="Paste a valid Jitsi JWT" autocomplete="off" />
          </div>
          <button type="submit" class="primary">Join call</button>
        </form>
        <p class="hint">
          Meet.jit.si now requires authentication. Provide either your Jitsi username and password or a valid JWT token created for the room.
        </p>
      </section>
      <section class="call-panel hidden" id="call-panel">
        <div class="call-layout">
          <div class="videos" id="video-stage">
            <h2>Call</h2>
            <div class="local" id="local-tracks"></div>
            <div class="remote" id="remote-tracks"></div>
          </div>
          <aside class="sidebar">
            <div class="participants" id="participants-panel">
              <h2>Participants</h2>
              <ul id="participants"></ul>
            </div>
            <div class="chat" id="chat-panel">
              <h2>Chat</h2>
              <div class="messages" id="messages"></div>
              <form id="chat-form">
                <input type="text" id="chat-input" placeholder="Type a message" autocomplete="off" />
                <button type="submit">Send</button>
              </form>
            </div>
            <div class="controls">
              <button id="toggle-audio">Mute audio</button>
              <button id="toggle-video">Hide video</button>
              <button id="leave" class="danger">Leave call</button>
            </div>
          </aside>
        </div>
      </section>
    </div>
  </body>
</html>
